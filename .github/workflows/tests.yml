name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install preprocess_dbs and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # the two tests that need a real cleaned recording skip themselves here (-rs prints why)
      - name: Run the tests
        run: python -m pytest -q -rs
